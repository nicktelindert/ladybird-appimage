name: Ladybird AppImage Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 1" # Wekelijks op maandagochtend om 04:00 UTC
  workflow_dispatch: {}

jobs:
  build:
    name: "${{ matrix.name }} (${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            name: Build AppImage
            arch: x86_64

    # Officiële Arch Linux container
    container: archlinux:latest

    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_DIR: "/github/home/.cache/sccache"
      CCACHE_DIR: "/github/home/.cache/ccache"
      CMAKE_C_COMPILER_LAUNCHER: "ccache"
      CMAKE_CXX_COMPILER_LAUNCHER: "ccache"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Arch Linux Environment
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm base-devel sccache ccache

      - name: Install Dependencies
        run: /bin/sh ./get-dependencies.sh

      # 1. Restore compiler cache before build
      - name: Restore Compiler Cache (sccache & ccache)
        uses: actions/cache/restore@v4
        with:
          path: |
            /github/home/.cache/sccache
            /github/home/.cache/ccache
          key: ${{ runner.os }}-${{ matrix.arch }}-build-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-build-cache-

      - name: Make AppImage
        run: /bin/sh ./make-appimage.sh

      # 2. Always save compiler cache (even if build fails)
      - name: Save Compiler Cache (sccache & ccache)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            /github/home/.cache/sccache
            /github/home/.cache/ccache
          key: ${{ runner.os }}-${{ matrix.arch }}-build-cache-${{ github.sha }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist

  release:
    if: ${{ github.ref_name == 'main' }}
    needs: [build]
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AppImage-*
          merge-multiple: true

      - name: Release AppImage
        uses: pkgforge-dev/make-stable-appimage-release@v1.1
