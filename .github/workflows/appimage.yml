name: Ladybird AppImage Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 1" # Weekly release
  workflow_dispatch: {}

jobs:
  build:
    name: "${{ matrix.name }} (${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            name: Build AppImage
            arch: x86_64

    container: archlinux:latest

    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_DIR: "/github/home/.cache/sccache"
      CCACHE_DIR: "/github/home/.cache/ccache"
      CMAKE_C_COMPILER_LAUNCHER: "ccache"
      CMAKE_CXX_COMPILER_LAUNCHER: "ccache"
      CC: clang
      CXX: clang++
      CMAKE_GENERATOR: Ninja
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Compiler Cache (sccache & ccache)
        uses: actions/cache/restore@v4
        with:
          path: |
            /github/home/.cache/sccache
            /github/home/.cache/ccache
          key: ${{ runner.os }}-${{ matrix.arch }}-build-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-build-cache-

      - name: Initialize Arch Linux Environment
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm base-devel sccache ccache

      - name: Install Dependencies
        run: |
          pacman -Syu --noconfirm intel-media-driver ffmpeg
          /bin/sh ./get-dependencies.sh

      - name: Make AppImage
        run: /bin/sh ./make-appimage.sh

      - name: Save Compiler Cache (sccache & ccache)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            /github/home/.cache/sccache
            /github/home/.cache/ccache
          key: ${{ runner.os }}-${{ matrix.arch }}-build-cache-${{ github.sha }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist/*

  release:
    if: ${{ github.ref_name == 'main' }}
    needs: [build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AppImage-*
          merge-multiple: true

      - name: Create Rolling Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Ladybird Continuous Build
          body: |
            Automated weekly build of Ladybird AppImage based on upstream master.
          files: |
            *.AppImage*
